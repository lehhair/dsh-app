<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>关闭</title>
    <style>
      /* Overlay dialog hosted in a transparent child webview (same
         architecture as settings.html): the mask dims whatever is below —
         the connected dsh page or the launcher — and a small card floats
         centered. No window chrome — not a window. */
      :root {
        color-scheme: light dark;
        --shell-bg: rgb(255, 255, 255);
        --shell-layer: rgb(255, 255, 255);
        --shell-layer-2: rgb(255, 255, 255);
        --shell-fg: rgb(15, 17, 21);
        --shell-fg-foreground: rgb(255, 255, 255);
        --shell-fg-secondary: rgb(97, 102, 107);
        --shell-fg-tertiary: rgb(129, 133, 140);
        --shell-border: rgba(0, 0, 0, 0.1);
        --shell-hover: rgba(38, 49, 72, 0.06);
        --shell-brand: rgb(15, 17, 21);
        --shell-brand-hover: rgb(67, 69, 74);
        --shell-danger: rgb(236, 19, 19);
        --shell-success: rgb(34, 197, 94);
        --shell-scrollbar-thumb: rgb(229, 229, 229);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --shell-bg: rgb(21, 21, 23);
          --shell-layer: rgb(44, 44, 46);
          --shell-layer-2: rgb(44, 44, 46);
          --shell-fg: rgb(249, 250, 251);
          --shell-fg-foreground: rgb(15, 17, 21);
          --shell-fg-secondary: rgb(207, 211, 214);
          --shell-fg-tertiary: rgb(173, 178, 184);
          --shell-border: rgba(255, 255, 255, 0.12);
          --shell-hover: rgba(255, 255, 255, 0.08);
          --shell-brand: rgb(249, 250, 251);
          --shell-brand-hover: rgb(235, 238, 242);
          --shell-danger: rgb(242, 90, 90);
          --shell-success: rgb(34, 197, 94);
          --shell-scrollbar-thumb: rgb(60, 60, 61);
        }
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { height: 100%; margin: 0; background: transparent; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        color: var(--shell-fg);
        padding-top: 40px;
        box-sizing: border-box;
      }

      .mask {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.24);
      }

      /* dsh dialog card (same family as settings.html): layer-2 ground,
         r20, tight fixed-height card for a confirm. */
      .dialog {
        position: relative;
        display: flex;
        flex-direction: column;
        width: min(400px, 92%);
        border: 1px solid var(--shell-border);
        border-radius: 20px;
        background: var(--shell-bg);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.24);
        overflow: hidden;
      }
      .dialog-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 16px 0 22px;
      }
      .dialog-header .title { font-size: 15px; font-weight: 500; color: var(--shell-fg); }
      .dialog-header button {
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--shell-fg-secondary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color 0.12s ease, color 0.12s ease;
      }
      .dialog-header button.hover { background: var(--shell-hover); color: var(--shell-fg); }
      .dialog-header button svg { width: 12px; height: 12px; display: block; }

      .dialog-body {
        padding: 10px 22px 4px;
        display: flex;
        flex-direction: column;
      }
      .dialog-body .question { font-size: 14px; line-height: 22px; color: var(--shell-fg); }
      .dialog-body .hint { font-size: 12px; line-height: 18px; color: var(--shell-fg-tertiary); margin: 6px 0 0; }

      /* remember checkbox — plain dsh-style switch */
      .remember {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 16px 22px 0;
        cursor: pointer;
        user-select: none;
      }
      .remember .toggle {
        position: relative;
        flex: none;
        width: 34px;
        height: 19px;
        border-radius: 10px;
        border: 1px solid var(--shell-border);
        background: var(--shell-layer);
        transition: background-color 0.12s ease, border-color 0.12s ease;
      }
      .remember .toggle::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--shell-fg-secondary);
        transition: transform 0.15s ease, background-color 0.12s ease;
      }
      .remember .toggle.on { background: var(--shell-brand); border-color: var(--shell-brand); }
      .remember .toggle.on::after { transform: translateX(15px); background: var(--shell-bg); }
      .remember .text { font-size: 13px; color: var(--shell-fg-secondary); }

      .dialog-foot {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 18px 22px 20px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        font-size: 13px;
        line-height: 20px;
        color: var(--shell-fg);
        background: transparent;
        padding: 0 16px;
        height: 34px;
        font-family: inherit;
      }
      .btn:disabled { opacity: 0.4; cursor: default; }
      .btn.outline { border: 1px solid var(--shell-border); }
      .btn.outline.hover:not(:disabled) { background: var(--shell-hover); }
      .btn.danger { background: var(--shell-danger); color: #fff; }
      .btn.danger.hover:not(:disabled) { opacity: 0.88; }
    </style>
  </head>
  <body>
    <div class="mask" id="mask"></div>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <div class="dialog-header">
        <span class="title" id="dlg-title">关闭窗口？</span>
        <button id="close" title="取消">
          <svg viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
        </button>
      </div>
      <div class="dialog-body">
        <p class="question">确定要关闭窗口吗？也可以退到系统托盘，让应用在后台继续运行。</p>
        <p class="hint" id="hint">选择后可在 启动页 → 本机实例 → 更多 中管理默认行为并重置。</p>
      </div>
      <label class="remember" for="remember-toggle">
        <button id="remember-toggle" class="toggle" role="switch" aria-checked="false" aria-label="记住此操作"></button>
        <span class="text">记住此操作，下次直接执行</span>
      </label>
      <div class="dialog-foot">
        <button id="to-tray" class="btn outline">退到托盘</button>
        <button id="confirm" class="btn danger">确认关闭</button>
      </div>
    </div>

    <script type="module" src="./close.js"></script>
  </body>
</html>
