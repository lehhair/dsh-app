<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>设置</title>
    <style>
      :root {
        color-scheme: light dark;
        --shell-bg: rgb(255, 255, 255);
        --shell-layer: rgb(255, 255, 255);
        --shell-fg: rgb(15, 17, 21);
        --shell-fg-secondary: rgb(97, 102, 107);
        --shell-fg-tertiary: rgb(129, 133, 140);
        --shell-border: rgba(0, 0, 0, 0.1);
        --shell-hover: rgba(38, 49, 72, 0.06);
        --shell-brand: rgb(15, 17, 21);
        --shell-brand-hover: rgb(67, 69, 74);
        --shell-danger: rgb(236, 19, 19);
        --shell-success: rgb(34, 197, 94);
        --shell-scrollbar-thumb: rgb(229, 229, 229);
        --shell-scrollbar-thumb-hover: rgb(212, 212, 212);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --shell-bg: rgb(21, 21, 23);
          --shell-layer: rgb(44, 44, 46);
          --shell-fg: rgb(249, 250, 251);
          --shell-fg-secondary: rgb(207, 211, 214);
          --shell-fg-tertiary: rgb(173, 178, 184);
          --shell-border: rgba(255, 255, 255, 0.12);
          --shell-hover: rgba(255, 255, 255, 0.08);
          --shell-brand: rgb(249, 250, 251);
          --shell-brand-hover: rgb(235, 238, 242);
          --shell-danger: rgb(242, 90, 90);
          --shell-success: rgb(34, 197, 94);
          --shell-scrollbar-thumb: rgb(60, 60, 61);
          --shell-scrollbar-thumb-hover: rgb(84, 85, 87);
        }
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      :root {
        --dsh-scrollbar-thumb: var(--shell-scrollbar-thumb);
        --dsh-scrollbar-thumb-hover: var(--shell-scrollbar-thumb-hover);
      }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { border-radius: 4px; background: var(--dsh-scrollbar-thumb); }
      ::-webkit-scrollbar-thumb:hover { background: var(--dsh-scrollbar-thumb-hover); }
      ::-webkit-scrollbar-corner { background: transparent; }

      html, body { height: 100%; margin: 0; }
      body {
        background: var(--shell-bg);
        color: var(--shell-fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* title bar */
      .titlebar {
        height: 40px;
        flex: none;
        display: flex;
        align-items: center;
        padding: 0 12px 0 16px;
        user-select: none;
        -webkit-app-region: drag;
      }
      .titlebar .title { font-size: 13px; font-weight: 500; color: var(--shell-fg); }
      .titlebar .spacer { flex: 1; }
      .titlebar button {
        -webkit-app-region: no-drag;
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--shell-fg-secondary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color 0.12s ease, color 0.12s ease;
      }
      .titlebar button:hover { background: var(--shell-hover); color: var(--shell-fg); }
      .titlebar button svg { width: 12px; height: 12px; display: block; }

      /* content */
      .content {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 8px 20px 24px;
      }
      .group-title { font-size: 12px; font-weight: 500; color: var(--shell-fg-tertiary); margin: 18px 0 8px; }
      .group:first-child .group-title { margin-top: 4px; }

      .current {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 12px;
        border: 1px solid var(--shell-border);
        border-radius: 10px;
        background: var(--shell-layer);
      }
      .current .name { font-size: 14px; font-weight: 500; }
      .current .url { font-size: 12px; color: var(--shell-fg-tertiary); word-break: break-all; }

      /* instance rows */
      .instance-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        margin: 0 -12px;
        border-radius: 10px;
        transition: background-color 0.12s ease;
      }
      .instance-row:hover { background: var(--shell-hover); }
      .instance-row .meta { flex: 1; min-width: 0; }
      .instance-row .meta .name { font-size: 14px; display: flex; align-items: center; gap: 6px; }
      .instance-row .meta .url { font-size: 12px; color: var(--shell-fg-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pill {
        display: inline-flex;
        align-items: center;
        height: 20px;
        padding: 0 6px;
        border-radius: 10px;
        font-size: 11px;
        color: var(--shell-fg-secondary);
        background: var(--shell-layer);
        border: 1px solid var(--shell-border);
      }
      .pill.on { color: var(--shell-fg); background: var(--shell-layer); border-color: var(--shell-brand); }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        font-size: 12px;
        line-height: 18px;
        color: var(--shell-fg);
        background: transparent;
        padding: 0 12px;
        height: 30px;
        font-family: inherit;
        flex: none;
      }
      .btn:disabled { opacity: 0.4; cursor: default; }
      .btn.primary { background: var(--shell-brand); color: var(--shell-bg); }
      .btn.primary:hover:not(:disabled) { background: var(--shell-brand-hover); }
      .btn.outline { border: 1px solid var(--shell-border); }
      .btn.ghost:hover:not(:disabled) { background: var(--shell-hover); }

      /* behavior row with toggle */
      .behavior {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
      }
      .behavior .label { font-size: 14px; }
      .toggle {
        position: relative;
        flex: none;
        width: 36px;
        height: 20px;
        border-radius: 10px;
        border: 1px solid var(--shell-border);
        background: var(--shell-layer);
        cursor: pointer;
        transition: background-color 0.12s ease, border-color 0.12s ease;
      }
      .toggle::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--shell-fg-secondary);
        transition: transform 0.15s ease, background-color 0.12s ease;
      }
      .toggle.on { background: var(--shell-brand); border-color: var(--shell-brand); }
      .toggle.on::after { transform: translateX(16px); background: var(--shell-bg); }

      .hint { font-size: 12px; color: var(--shell-fg-tertiary); margin: 0; }
    </style>
  </head>
  <body>
    <header class="titlebar">
      <span class="title">设置</span>
      <div class="spacer"></div>
      <button id="close" title="关闭">
        <svg viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
      </button>
    </header>

    <main class="content">
      <div class="group">
        <div class="group-title">当前连接</div>
        <div class="current">
          <span class="name" id="cur-name">未连接</span>
          <span class="url" id="cur-url"></span>
          <div style="display:flex;gap:8px;margin-top:6px">
            <button id="disconnect" class="btn outline">断开</button>
            <button id="to-launcher" class="btn ghost">返回启动页</button>
          </div>
        </div>
      </div>

      <div class="group">
        <div class="group-title">实例</div>
        <div id="instances"></div>
      </div>

      <div class="group">
        <div class="group-title">行为</div>
        <div class="behavior">
          <span class="label">开机自启</span>
          <button id="login-item" class="toggle" role="switch" aria-checked="false" title="开机时自动启动 dsh app"></button>
        </div>
        <p class="hint">开机时自动启动本应用。</p>
      </div>
    </main>

    <script>
      const closeBtn = document.getElementById('close')
      const curName = document.getElementById('cur-name')
      const curUrl = document.getElementById('cur-url')
      const disconnectBtn = document.getElementById('disconnect')
      const toLauncherBtn = document.getElementById('to-launcher')
      const instancesEl = document.getElementById('instances')
      const loginItemBtn = document.getElementById('login-item')

      closeBtn.addEventListener('click', () => window.dshShell.settings.close())

      async function renderCurrent() {
        const cur = await window.dshShell.settings.current()
        if (cur.type === null) {
          curName.textContent = '未连接'
          curUrl.textContent = ''
          disconnectBtn.disabled = true
          return
        }
        curName.textContent = cur.type === 'local' ? '本机实例' : cur.name
        curUrl.textContent = cur.url
        disconnectBtn.disabled = false
      }

      async function renderInstances() {
        const instances = await window.dshShell.remote.list()
        instancesEl.textContent = ''
        for (const inst of instances) {
          const row = document.createElement('div')
          row.className = 'instance-row'
          const meta = document.createElement('div')
          meta.className = 'meta'
          const name = document.createElement('div')
          name.className = 'name'
          name.textContent = inst.name
          if (inst.isDefault) {
            const pill = document.createElement('span')
            pill.className = 'pill on'
            pill.textContent = '默认'
            name.appendChild(pill)
          }
          const url = document.createElement('div')
          url.className = 'url'
          url.textContent = inst.url
          meta.append(name, url)
          const connect = document.createElement('button')
          connect.className = 'btn primary'
          connect.textContent = '连接'
          connect.addEventListener('click', async () => {
            const r = await window.dshShell.remote.connect(inst.id)
            if (r.ok) await window.dshShell.settings.close()
          })
          row.append(meta, connect)
          instancesEl.appendChild(row)
        }
        if (instances.length === 0) {
          const hint = document.createElement('p')
          hint.className = 'hint'
          hint.textContent = '还没有远程实例，可在启动页添加。'
          instancesEl.appendChild(hint)
        }
      }

      async function renderLoginItem() {
        const on = await window.dshShell.settings.getLoginItem()
        loginItemBtn.classList.toggle('on', on)
        loginItemBtn.setAttribute('aria-checked', String(on))
      }

      loginItemBtn.addEventListener('click', async () => {
        const on = !loginItemBtn.classList.contains('on')
        await window.dshShell.settings.setLoginItem(on)
        loginItemBtn.classList.toggle('on', on)
        loginItemBtn.setAttribute('aria-checked', String(on))
      })

      disconnectBtn.addEventListener('click', async () => {
        await window.dshShell.remote.disconnect()
        await window.dshShell.settings.close()
      })

      toLauncherBtn.addEventListener('click', async () => {
        await window.dshShell.back()
        await window.dshShell.settings.close()
      })

      renderCurrent()
      renderInstances()
      renderLoginItem()
    </script>
  </body>
</html>
