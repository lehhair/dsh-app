<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>设置</title>
    <style>
      /* Overlay dialog hosted in a transparent WebContentsView: the mask
         (rgba 0.24, dsh bg-mask-1) sits over the connected dsh page below,
         the card floats centered. No window chrome — not a window. */
      :root {
        color-scheme: light dark;
        --shell-bg: rgb(255, 255, 255);
        --shell-layer: rgb(255, 255, 255);
        --shell-layer-2: rgb(255, 255, 255);
        --shell-fg: rgb(15, 17, 21);
        --shell-fg-foreground: rgb(255, 255, 255);
        --shell-fg-secondary: rgb(97, 102, 107);
        --shell-fg-tertiary: rgb(129, 133, 140);
        --shell-border: rgba(0, 0, 0, 0.1);
        --shell-hover: rgba(38, 49, 72, 0.06);
        --shell-brand: rgb(15, 17, 21);
        --shell-brand-hover: rgb(67, 69, 74);
        --shell-danger: rgb(236, 19, 19);
        --shell-success: rgb(34, 197, 94);
        --shell-scrollbar-thumb: rgb(229, 229, 229);
        --shell-scrollbar-thumb-hover: rgb(212, 212, 212);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --shell-bg: rgb(21, 21, 23);
          --shell-layer: rgb(44, 44, 46);
          --shell-layer-2: rgb(44, 44, 46);
          --shell-fg: rgb(249, 250, 251);
          --shell-fg-foreground: rgb(15, 17, 21);
          --shell-fg-secondary: rgb(207, 211, 214);
          --shell-fg-tertiary: rgb(173, 178, 184);
          --shell-border: rgba(255, 255, 255, 0.12);
          --shell-hover: rgba(255, 255, 255, 0.08);
          --shell-brand: rgb(249, 250, 251);
          --shell-brand-hover: rgb(235, 238, 242);
          --shell-danger: rgb(242, 90, 90);
          --shell-success: rgb(34, 197, 94);
          --shell-scrollbar-thumb: rgb(60, 60, 61);
          --shell-scrollbar-thumb-hover: rgb(84, 85, 87);
        }
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      /* dsh scrollbar skin (mirrors ui-theme scrollbar.css) */
      :root {
        --dsh-scrollbar-thumb: var(--shell-scrollbar-thumb);
        --dsh-scrollbar-thumb-hover: var(--shell-scrollbar-thumb-hover);
      }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { border-radius: 4px; background: var(--dsh-scrollbar-thumb); }
      ::-webkit-scrollbar-thumb:hover { background: var(--dsh-scrollbar-thumb-hover); }
      ::-webkit-scrollbar-corner { background: transparent; }
      /* auto-hide on the instance list: visible while scrolling/hovered */
      .dialog-scroll::-webkit-scrollbar-thumb { background: transparent; transition: background-color 0.2s ease; }
      .dialog-scroll:hover::-webkit-scrollbar-thumb,
      .dialog-scroll.scrolling::-webkit-scrollbar-thumb { background: var(--dsh-scrollbar-thumb); }
      .dialog-scroll:hover::-webkit-scrollbar-thumb:hover,
      .dialog-scroll.scrolling::-webkit-scrollbar-thumb:hover { background: var(--dsh-scrollbar-thumb-hover); }
      @supports not selector(::-webkit-scrollbar) {
        body, body * { scrollbar-width: thin; scrollbar-color: var(--dsh-scrollbar-thumb) transparent; }
      }
      html, body { height: 100%; margin: 0; background: transparent; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .mask {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.24);
      }

      /* dsh dialog card (figma Mask + Dialog 451:18655): r24, layer-2, shadow.
         Fixed height with three zones: header + fixed top (current/local),
         scrollable middle (remote instances), fixed footer (behaviors). */
      .dialog {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 0;
        width: min(460px, 92%);
        height: min(560px, 86%);
        border: 1px solid var(--shell-border);
        border-radius: 24px;
        background: var(--shell-bg);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.24);
        overflow: hidden;
      }
      .dialog-header {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 16px 4px 24px;
      }
      .dialog-header .title { font-size: 16px; font-weight: 500; color: var(--shell-fg); }
      .dialog-header button {
        width: 28px;
        height: 28px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--shell-fg-secondary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background-color 0.12s ease, color 0.12s ease;
      }
      .dialog-header button:hover { background: var(--shell-hover); color: var(--shell-fg); }
      .dialog-header button svg { width: 12px; height: 12px; display: block; }

      .dialog-fixed {
        flex: none;
        padding: 0 24px;
      }
      .dialog-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 24px 20px;
      }
      .group-title { font-size: 12px; font-weight: 500; color: var(--shell-fg-tertiary); margin: 14px 0 8px; }

      /* dsh Input atom (ui-primitives Input): wrap + icon + borderless input,
         container border highlights on focus-within */
      .search {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 8px;
        width: 100%;
        border: 1px solid var(--shell-border);
        border-radius: 8px;
        background: var(--shell-layer);
        transition: border-color 0.12s ease;
      }
      .search:focus-within { border-color: var(--shell-brand); }
      .search-icon {
        display: inline-flex;
        width: 16px;
        height: 16px;
        align-items: center;
        justify-content: center;
        color: var(--shell-fg-tertiary);
        flex: none;
      }
      .search-icon svg { width: 14px; height: 14px; display: block; }
      .search-input {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        background: transparent;
        font-size: 13px;
        line-height: 20px;
        color: var(--shell-fg);
      }
      .search-input::placeholder { color: var(--shell-fg-tertiary); }
      .group:first-child .group-title { margin-top: 2px; }

      .current {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 10px;
        border: 1px solid var(--shell-border);
        border-radius: 10px;
        background: var(--shell-layer);
      }
      .current .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
      .current .name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .current .url { font-size: 11px; color: var(--shell-fg-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .current .actions { display: flex; gap: 6px; flex: none; }
      .btn.sm { height: 24px; padding: 0 10px; font-size: 11px; line-height: 16px; border-radius: 12px; }

      .instance-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        margin: 0 -12px;
        border-radius: 10px;
        transition: background-color 0.12s ease;
      }
      .instance-row:hover { background: var(--shell-hover); }
      .instance-row .meta { flex: 1; min-width: 0; }
      .instance-row .meta .name { font-size: 14px; display: flex; align-items: center; gap: 6px; }
      .instance-row .meta .url { font-size: 12px; color: var(--shell-fg-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pill {
        display: inline-flex;
        align-items: center;
        height: 20px;
        padding: 0 6px;
        border-radius: 10px;
        font-size: 11px;
        color: var(--shell-fg-secondary);
        background: var(--shell-layer);
        border: 1px solid var(--shell-border);
      }
      .pill.on { color: var(--shell-fg); border-color: var(--shell-brand); }

      /* state dot (green when running) */
      .dot {
        position: relative;
        display: inline-block;
        flex: none;
        width: 10px;
        height: 10px;
        min-width: 10px;
        min-height: 10px;
      }
      .dot::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.1;
      }
      .dot::after {
        content: '';
        position: absolute;
        inset: 2px;
        border-radius: 50%;
        background: currentColor;
      }
      .dot.done { color: var(--shell-success); }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        font-size: 12px;
        line-height: 18px;
        color: var(--shell-fg);
        background: transparent;
        padding: 0 12px;
        height: 30px;
        font-family: inherit;
        flex: none;
      }
      .btn:disabled { opacity: 0.4; cursor: default; }
      .btn.primary { background: var(--shell-brand); color: var(--shell-bg); }
      .btn.primary:hover:not(:disabled) { background: var(--shell-brand-hover); }
      .btn.outline { border: 1px solid var(--shell-border); }
      .btn.ghost:hover:not(:disabled) { background: var(--shell-hover); }

      .hint { font-size: 12px; color: var(--shell-fg-tertiary); margin: 0; }
    </style>
  </head>
  <body>
    <div class="mask"></div>
    <div class="dialog">
      <div class="dialog-header">
        <span class="title">设置</span>
        <button id="close" title="关闭">
          <svg viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
        </button>
      </div>
      <div class="dialog-fixed">
        <p class="dialog-error" id="dlg-error"></p>
        <div class="group">
          <div class="group-title" style="margin-top:4px">当前连接</div>
          <div class="current">
            <div class="info">
              <span class="name" id="cur-name">未连接</span>
              <span class="url" id="cur-url"></span>
            </div>
            <div class="actions">
              <button id="disconnect" class="btn sm outline">断开</button>
              <button id="to-launcher" class="btn sm ghost">返回启动页</button>
            </div>
          </div>
        </div>

        <div class="group">
          <div class="group-title">本机实例</div>
          <div class="instance-row" id="local-instance" style="margin-top:-4px">
            <span class="dot" id="local-dot"></span>
            <div class="meta">
              <div class="name">本机实例</div>
              <div class="url" id="local-url">未启动</div>
            </div>
            <button id="local-toggle" class="btn primary">启动</button>
            <button id="local-enter" class="btn outline" disabled>进入</button>
          </div>
        </div>

        <div style="padding: 12px 0 2px">
          <span class="search">
            <span class="search-icon"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M11.894845 6.647401C11.894845 3.725463 9.534486 1.356779 6.623219 1.35657C3.711786 1.35657 1.351635 3.725338 1.351635 6.647401C1.351843 9.569296 3.711911 11.938273 6.623219 11.938273C9.534361 11.938064 11.894637 9.569171 11.894845 6.647401ZM13.245462 6.647401C13.245254 10.317935 10.280401 13.293613 6.623219 13.293821C2.965871 13.293821 0.000204 10.31806 0 6.647401C0 2.976574 2.965746 0 6.623219 0C10.280526 0.000205 13.245462 2.9767 13.245462 6.647401Z"/><path d="M16.000417 15.041079L15.044449 16.000433L11.530434 12.473588L12.486298 11.514234L16.000417 15.041079Z"/></svg></span>
            <input id="inst-search" class="search-input" placeholder="搜索" spellcheck="false" />
          </span>
        </div>
      </div>

      <div class="dialog-scroll">
        <div id="instances"></div>
      </div>
    </div>

    <script>
      // ---- dsh alias token -> shell variable map (theme fusion, same as launcher) ----
      const TOKEN_MAP = {
        '--dsw-alias-bg-base': '--shell-bg',
        '--dsw-alias-bg-layer-1': '--shell-layer',
        '--dsw-alias-bg-layer-2': '--shell-layer-2',
        '--dsw-alias-label-primary': '--shell-fg',
        '--dsw-alias-label-primary-foreground': '--shell-fg-foreground',
        '--dsw-alias-label-secondary': '--shell-fg-secondary',
        '--dsw-alias-label-tertiary': '--shell-fg-tertiary',
        '--dsw-alias-border-l2': '--shell-border',
        '--dsw-alias-interactive-bg-hover': '--shell-hover',
        '--dsw-alias-button-primary-fill': '--shell-brand',
        '--dsw-alias-button-primary-hover': '--shell-brand-hover',
        '--dsw-alias-state-error-primary': '--shell-danger',
        '--dsw-alias-state-success-primary': '--shell-success',
      }
      window.dshShell.onThemeSync((tokens) => {
        const root = document.documentElement
        for (const [alias, value] of Object.entries(tokens)) {
          const target = TOKEN_MAP[alias]
          if (target && value) root.style.setProperty(target, value)
        }
      })

      const closeBtn = document.getElementById('close')
      const curName = document.getElementById('cur-name')
      const curUrl = document.getElementById('cur-url')
      const disconnectBtn = document.getElementById('disconnect')
      const toLauncherBtn = document.getElementById('to-launcher')
      const instancesEl = document.getElementById('instances')
      const dlgError = document.getElementById('dlg-error')

      // ---- local embedded instance row ----
      const localDot = document.getElementById('local-dot')
      const localUrl = document.getElementById('local-url')
      const localToggle = document.getElementById('local-toggle')
      const localEnter = document.getElementById('local-enter')

      async function renderLocal() {
        const s = await window.dshShell.status()
        localDot.className = s.running ? 'dot done' : 'dot'
        localUrl.textContent = s.running ? s.url : '未启动'
        localToggle.textContent = s.running ? '停止' : '启动'
        localToggle.className = `btn ${s.running ? 'outline' : 'primary'}`
        localEnter.disabled = !s.running
      }

      localToggle.addEventListener('click', async () => {
        const s = await window.dshShell.status()
        if (s.running) await window.dshShell.stopLocal()
        else await window.dshShell.startLocal()
        renderLocal()
      })

      localEnter.addEventListener('click', async () => {
        const s = await window.dshShell.status()
        if (s.running) {
          await window.dshShell.connect(s.url)
          await window.dshShell.settings.close()
        }
      })

      closeBtn.addEventListener('click', () => window.dshShell.settings.close())

      let currentId = null
      async function renderCurrent() {
        const cur = await window.dshShell.settings.current()
        currentId = cur.id ?? null
        if (cur.type === null) {
          curName.textContent = '未连接'
          curUrl.textContent = ''
          disconnectBtn.disabled = true
          return
        }
        curName.textContent = cur.type === 'local' ? '本机实例' : cur.name
        curUrl.textContent = cur.url
        disconnectBtn.disabled = false
      }

      let instanceQuery = ''
      const instSearch = document.getElementById('inst-search')
      const scrollZone = document.querySelector('.dialog-scroll')
      // auto-hide scrollbar: visible while scrolling, fades after stop
      let scrollHideTimer = null
      scrollZone.addEventListener('scroll', () => {
        scrollZone.classList.add('scrolling')
        clearTimeout(scrollHideTimer)
        scrollHideTimer = setTimeout(() => scrollZone.classList.remove('scrolling'), 500)
      })

      async function renderInstances() {
        const query = instanceQuery
        const instances = await window.dshShell.remote.list()
        const matches = query
          ? instances.filter((inst) =>
              inst.name.toLowerCase().includes(query) || inst.url.toLowerCase().includes(query))
          : instances
        instancesEl.textContent = ''
        for (const inst of matches) {
          const row = document.createElement('div')
          row.className = 'instance-row'
          const dot = document.createElement('span')
          dot.className = 'dot'
          dot.title = '检测中'
          row.appendChild(dot)
          const meta = document.createElement('div')
          meta.className = 'meta'
          const name = document.createElement('div')
          name.className = 'name'
          name.textContent = inst.name
          if (currentId === inst.id) {
            const pill = document.createElement('span')
            pill.className = 'pill on'
            pill.textContent = '当前'
            name.appendChild(pill)
          }
          const url = document.createElement('div')
          url.className = 'url'
          url.textContent = inst.url
          meta.append(name, url)
          const connect = document.createElement('button')
          connect.className = 'btn primary'
          connect.textContent = '连接'
          connect.addEventListener('click', async () => {
            dlgError.textContent = ''
            const r = await window.dshShell.remote.connect(inst.id)
            if (r.ok) await window.dshShell.settings.close()
            else dlgError.textContent = r.error || '连接失败'
          })
          row.append(dot, meta, connect)
          instancesEl.appendChild(row)
          window.dshShell.remote.health(inst.id).then((h) => {
            dot.className = h.status === 'online' ? 'dot done'
              : h.status === 'unauthorized' ? 'dot danger'
              : 'dot'
            dot.title = h.status === 'online' ? '在线'
              : h.status === 'unauthorized' ? '密钥无效'
              : '离线'
          })
        }
        if (matches.length === 0) {
          const hint = document.createElement('p')
          hint.className = 'hint'
          hint.textContent = query ? '没有匹配的实例' : '还没有远程实例，可在启动页添加。'
          instancesEl.appendChild(hint)
        }
      }

      instSearch.addEventListener('input', (event) => {
        instanceQuery = event.target.value.trim().toLowerCase()
        renderInstances()
      })

      disconnectBtn.addEventListener('click', async () => {
        await window.dshShell.remote.disconnect()
        await window.dshShell.settings.close()
      })

      toLauncherBtn.addEventListener('click', async () => {
        await window.dshShell.back()
        await window.dshShell.settings.close()
      })

      renderCurrent()
      renderLocal()
      renderInstances()
    </script>
  </body>
</html>
