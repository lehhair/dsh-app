<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DeepSeek Harness</title>
    <style>
      :root {
        color-scheme: light dark;
        --dsh-bg: rgb(255, 255, 255);
        --dsh-fg: rgb(15, 17, 21);
        --dsh-fg-secondary: rgb(97, 102, 107);
        --dsh-fg-tertiary: rgb(129, 133, 140);
        --dsh-border: rgba(0, 0, 0, 0.1);
        --dsh-hover: rgba(38, 49, 72, 0.06);
        --dsh-success: rgb(34, 197, 94);
        --dsh-danger: rgb(236, 19, 19);
        --dsh-scroll-thumb: rgb(229, 229, 229);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --dsh-bg: rgb(21, 21, 23);
          --dsh-fg: rgb(249, 250, 251);
          --dsh-fg-secondary: rgb(207, 211, 214);
          --dsh-fg-tertiary: rgb(173, 178, 184);
          --dsh-border: rgba(255, 255, 255, 0.12);
          --dsh-hover: rgba(255, 255, 255, 0.08);
          --dsh-success: rgb(34, 197, 94);
          --dsh-danger: rgb(242, 90, 90);
          --dsh-scroll-thumb: rgb(60, 60, 61);
        }
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-thumb { border-radius: 4px; background: var(--dsh-scroll-thumb); }
      ::-webkit-scrollbar-track { background: transparent; }

      html, body { height: 100%; margin: 0; }
      body {
        background: var(--dsh-bg);
        color: var(--dsh-fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }

      /* brand header — padded below the status bar (edge-to-edge; the
         SystemBars plugin injects --safe-area-inset-top into the page) */
      header {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: calc(14px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px))) 16px 10px;
      }
      .logo {
        display: inline-block;
        flex: none;
        width: 24px;
        height: 18px;
        background: currentColor;
        -webkit-mask: url(fish.svg) no-repeat center / contain;
        mask: url(fish.svg) no-repeat center / contain;
      }
      header .title { font-size: 17px; font-weight: 600; }
      header .spacer { flex: 1; }
      header .btn-ghost {
        border: none; background: transparent; color: var(--dsh-fg-secondary);
        font-size: 13px; padding: 6px 10px; border-radius: 8px; cursor: pointer;
      }
      header .btn-ghost:hover { background: var(--dsh-hover); }

      main { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px; }

      /* section title */
      .section-title {
        display: flex; align-items: center; gap: 8px;
        font-size: 15px; font-weight: 500; margin: 8px 0 4px;
      }
      .section-title .count { font-size: 12px; color: var(--dsh-fg-tertiary); font-weight: 400; }
      .section-title .spacer { flex: 1; }

      /* node rows (dsh look: divider rows, no cards) */
      .node-row {
        display: flex; align-items: center; gap: 10px;
        padding: 14px 2px; border-bottom: 1px solid var(--dsh-border);
      }
      .node-row:last-child { border-bottom: none; }
      .dot {
        position: relative; flex: none; width: 10px; height: 10px; min-width: 10px;
      }
      .dot::before {
        content: ''; position: absolute; inset: 0; border-radius: 50%;
        background: currentColor; opacity: 0.1;
      }
      .dot::after {
        content: ''; position: absolute; inset: 2px; border-radius: 50%;
        background: currentColor;
      }
      .dot.on { color: var(--dsh-success); }
      .dot.bad { color: var(--dsh-danger); }
      .dot.off { color: var(--dsh-fg-tertiary); }
      .node-info { flex: 1; min-width: 0; }
      .node-name { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
      .node-url { font-size: 12px; color: var(--dsh-fg-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
      .node-actions { display: flex; gap: 6px; flex: none; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center;
        height: 32px; padding: 0 14px; border-radius: 16px; cursor: pointer;
        border: 1px solid var(--dsh-border); background: transparent;
        font: inherit; font-size: 13px; color: var(--dsh-fg);
      }
      .btn.primary { border-color: transparent; background: var(--dsh-fg); color: var(--dsh-bg); }
      .btn.sm { height: 28px; padding: 0 10px; border-radius: 14px; font-size: 12px; }
      .btn:disabled { opacity: 0.4; cursor: default; }

      /* add/edit form */
      .form {
        margin: 8px 0; padding: 12px; border: 1px solid var(--dsh-border);
        border-radius: 12px; display: flex; flex-direction: column; gap: 10px;
      }
      .form input {
        height: 40px; padding: 0 12px; border: 1px solid var(--dsh-border);
        border-radius: 8px; background: transparent; color: var(--dsh-fg);
        font: inherit; font-size: 14px; outline: none;
      }
      .form input:focus { border-color: var(--dsh-fg-secondary); }
      .form input::placeholder { color: var(--dsh-fg-tertiary); }
      .form .row { display: flex; gap: 8px; }
      .form .row .btn { flex: 1; }
      .form-error { font-size: 12px; color: var(--dsh-danger); margin: 0; }

      .empty {
        padding: 24px 0; text-align: center; font-size: 13px; color: var(--dsh-fg-tertiary);
      }

      /* footer: app info */
      footer {
        flex: none; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
        font-size: 12px; color: var(--dsh-fg-tertiary); text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="logo"></span>
      <span class="title">DeepSeek Harness</span>
      <span class="spacer"></span>
      <button id="add-btn" class="btn-ghost">添加节点</button>
    </header>

    <main id="list"></main>

    <footer>内嵌 dsh 移动客户端 · 连接远程 dsh 网关</footer>

    
    <script id="inject-back-js">
// Injected into the remote dsh page inside the mobile WebView. Same
// mechanism as the desktop view-preload spike: find the settings panel (stable
// aria-modal dialog), put a "回到启动页" button in its header actions seat,
// and route back to the launcher when tapped.
//
// Injected as a plain script string (no preload in mobile WebView), so it is
// self-contained: no requires, no imports — only DOM + a back callback that
// the native layer supplies as `window.__dshAppBackToLauncher` before
// injecting.

(function () {
  'use strict'

  var BACK_KEY = 'dsh-app-back-to-launcher'

  function injectStyles() {
    if (document.getElementById(BACK_KEY + '-style')) return
    var style = document.createElement('style')
    style.id = BACK_KEY + '-style'
    style.textContent =
      '.' + BACK_KEY + '{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:4px;height:28px;padding:0 10px;border:1px solid var(--dsw-alias-border-l2);border-radius:14px;background:transparent;color:var(--dsw-alias-label-primary);font:inherit;font-size:12px;line-height:18px;cursor:pointer;}' +
      '.' + BACK_KEY + ':hover{background:var(--dsw-alias-interactive-bg-hover);}'
    document.head.appendChild(style)
  }

  var backButton = null

  function ensureBackButton() {
    if (backButton && backButton.isConnected) return
    injectStyles()
    var seat = document.querySelector('[data-slot="settings.action"]')
    var host = seat ? seat.parentElement : null
    if (!seat || !host) return
    var btn = document.createElement('button')
    btn.type = 'button'
    btn.className = BACK_KEY
    btn.textContent = '回到启动页'
    btn.addEventListener('click', function () {
      if (window.DshNativeBridge && window.DshNativeBridge.close) {
        window.DshNativeBridge.close()
      } else if (window.__dshAppBackToLauncher) {
        window.__dshAppBackToLauncher()
      }
    })
    host.appendChild(btn)
    backButton = btn
  }

  function watch() {
    if (document.querySelector('[role="dialog"][aria-modal="true"]')) {
      ensureBackButton()
    } else {
      backButton = null
    }
  }

  watch()
  setInterval(watch, 1000)
})()

    </script>
    <script src="mobile-bridge.js"></script>
    <script>
      const listEl = document.getElementById('list')
      const addBtn = document.getElementById('add-btn')

      let nodes = []

      function dotClass(status) {
        return status === 'online' ? 'on' : status === 'unauthorized' ? 'bad' : 'off'
      }

      function render() {
        listEl.textContent = ''
        if (nodes.length === 0) {
          const empty = document.createElement('p')
          empty.className = 'empty'
          empty.textContent = '还没有远程节点，点右上角"添加节点"'
          listEl.appendChild(empty)
          return
        }
        const title = document.createElement('div')
        title.className = 'section-title'
        title.innerHTML = `<span>远程节点</span><span class="count">${nodes.length}</span>`
        listEl.appendChild(title)
        for (const node of nodes) {
          const row = document.createElement('div')
          row.className = 'node-row'
          row.setAttribute('data-node-id', node.id)
          const dot = document.createElement('span')
          dot.className = `dot ${dotClass(node.status)}`
          const info = document.createElement('div')
          info.className = 'node-info'
          const name = document.createElement('div')
          name.className = 'node-name'
          name.textContent = node.name
          const url = document.createElement('div')
          url.className = 'node-url'
          url.textContent = node.url
          info.append(name, url)
          const actions = document.createElement('div')
          actions.className = 'node-actions'
          const connect = document.createElement('button')
          connect.className = 'btn sm primary'
          connect.textContent = '连接'
          connect.addEventListener('click', async () => {
            connect.disabled = true
            connect.textContent = '连接中…'
            const r = await Bridge.connect(node.id)
            if (r && r.error) {
              connect.disabled = false
              connect.textContent = '连接'
              const err = document.createElement('p')
              err.className = 'form-error'
              err.style.cssText = 'margin:4px 2px 0;'
              err.textContent = r.error
              row.appendChild(err)
            }
            // On success the WebView covers the screen; button state no
            // longer matters until the user closes it.
          })
          const edit = document.createElement('button')
          edit.className = 'btn sm'
          edit.textContent = '编辑'
          edit.addEventListener('click', () => openForm(node))
          const del = document.createElement('button')
          del.className = 'btn sm'
          del.textContent = '删除'
          del.addEventListener('click', async () => {
            await Bridge.removeNode(node.id)
            await refresh()
          })
          actions.append(connect, edit, del)
          row.append(dot, info, actions)
          listEl.appendChild(row)
        }
      }

      async function refresh() {
        nodes = await Bridge.listNodes()
        render()
        // Real reachability per node — dots flip as each probe resolves.
        for (const node of nodes) {
          Bridge.health(node.id).then((h) => {
            node.status = h.status
            const row = listEl.querySelector(`[data-node-id="${node.id}"]`)
            const dot = row?.querySelector('.dot')
            if (dot) dot.className = `dot ${dotClass(node.status)}`
          })
        }
      }

      addBtn.addEventListener('click', () => openForm())

      function openForm(node) {
        const form = document.createElement('div')
        form.className = 'form'
        const name = document.createElement('input')
        name.placeholder = '名称，如 书房网关'
        name.value = node?.name ?? ''
        const url = document.createElement('input')
        url.placeholder = 'http://192.168.1.233:8443'
        url.value = node?.url ?? ''
        const key = document.createElement('input')
        key.type = 'password'
        key.placeholder = '访问密钥'
        key.value = ''
        const row = document.createElement('div')
        row.className = 'row'
        const save = document.createElement('button')
        save.className = 'btn primary'
        save.textContent = '保存'
        const cancel = document.createElement('button')
        cancel.className = 'btn'
        cancel.textContent = '取消'
        const err = document.createElement('p')
        err.className = 'form-error'
        row.append(save, cancel)
        form.append(name, url, key, row, err)
        // insert after header
        document.querySelector('header').after(form)
        name.focus()
        form.scrollIntoView({ behavior: 'smooth', block: 'start' })
        save.addEventListener('click', async () => {
          err.textContent = ''
          const r = await Bridge.saveNode({
            id: node?.id,
            name: name.value.trim(),
            url: url.value.trim(),
            key: key.value,
          })
          if (r && r.error) {
            err.textContent = r.error
            return
          }
          form.remove()
          await refresh()
        })
        cancel.addEventListener('click', () => form.remove())
      }

      refresh()

      // ---- safe-area: pad the header below the status bar ----
      // SystemBars insetsHandling is disabled; read the status bar height
      // natively and expose it as --safe-area-inset-top for the CSS.
      (function applySafeArea() {
        const root = document.documentElement
        const set = (v) => root.style.setProperty('--safe-area-inset-top', v + 'px')
        const tryRead = () => {
          const DshNative = window.Capacitor?.Plugins?.DshNative
          if (DshNative?.getStatusBarHeight) {
            DshNative.getStatusBarHeight().then((r) => {
              if (r && typeof r.height === 'number') set(r.height)
            }).catch(() => {})
            return true
          }
          return false
        }
        if (!tryRead() && window.Capacitor?.addListener) {
          window.Capacitor.addListener('capacitorReady', tryRead)
        }
        // Fallback: env() handled by CSS itself.
      })()
    </script>
  </body>
</html>
