<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dsh app</title>
    <style>
      /* Shell palette = dsh alias tokens (light/dark defaults). While a dsh
         page is connected, view-preload samples the page's ACTUAL tokens and
         the shell overwrites these via theme:sync — so extension/version
         theme changes are followed, never hardcoded. */
      :root {
        color-scheme: light dark;
        --shell-bg: rgb(255, 255, 255);
        --shell-layer: rgb(255, 255, 255);
        --shell-fg: rgb(15, 17, 21);
        --shell-fg-secondary: rgb(97, 102, 107);
        --shell-fg-tertiary: rgb(129, 133, 140);
        --shell-border: rgba(0, 0, 0, 0.1);
        --shell-hover: rgba(38, 49, 72, 0.06);
        --shell-brand: rgb(15, 17, 21);
        --shell-brand-hover: rgb(67, 69, 74);
        --shell-danger: rgb(236, 19, 19);
        --shell-success: rgb(34, 197, 94);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --shell-bg: rgb(21, 21, 23);
          --shell-layer: rgb(44, 44, 46);
          --shell-fg: rgb(249, 250, 251);
          --shell-fg-secondary: rgb(207, 211, 214);
          --shell-fg-tertiary: rgb(173, 178, 184);
          --shell-border: rgba(255, 255, 255, 0.12);
          --shell-hover: rgba(255, 255, 255, 0.08);
          --shell-brand: rgb(249, 250, 251);
          --shell-brand-hover: rgb(235, 238, 242);
          --shell-danger: rgb(242, 90, 90);
          --shell-success: rgb(34, 197, 94);
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--shell-bg);
        color: var(--shell-fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* fish logo via mask: color rides currentColor exactly like dsh's wordmark */
      .logo {
        display: inline-block;
        flex: none;
        background: currentColor;
        -webkit-mask: url(fish.svg) no-repeat center / contain;
        mask: url(fish.svg) no-repeat center / contain;
      }

      /* ---- title bar: same ground as the page, no dividing line (fusion) ---- */
      .titlebar {
        height: 44px;
        flex: none;
        display: flex;
        align-items: center;
        background: var(--shell-bg);
        color: var(--shell-fg);
        user-select: none;
        -webkit-app-region: drag;
      }
      .titlebar .status {
        font-size: 12px;
        color: var(--shell-fg-tertiary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
        margin-left: 6px;
      }
      .titlebar .spacer { flex: 1; }
      .titlebar button {
        -webkit-app-region: no-drag;
        width: 46px;
        height: 100%;
        border: none;
        background: transparent;
        color: var(--shell-fg-secondary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: default;
      }
      .titlebar button:disabled { opacity: 0.35; }
      .titlebar button:hover:not(:disabled) { background: var(--shell-hover); color: var(--shell-fg); }
      .titlebar button.close:hover:not(:disabled) { background: var(--shell-danger); color: #fff; }
      .titlebar button svg { display: block; }
      .titlebar button.btn-nav { width: 40px; }
      .titlebar button.btn-nav svg { width: 11px; height: 11px; }
      .titlebar button.btn-settings { width: 44px; }
      .titlebar button.btn-settings svg { width: 14px; height: 14px; }

      /* ---- launcher content (dsh look: no card containers) ---- */
      .content {
        flex: 1;
        min-height: 0;
        overflow: auto;
        display: flex;
        justify-content: center;
        padding: 56px 24px 40px;
      }
      .page { width: min(520px, 100%); }
      .hero { text-align: center; margin-bottom: 40px; }
      .hero .logo { width: 40px; height: 30px; color: var(--shell-fg); }
      .hero h1 { font-size: 20px; font-weight: 500; margin: 14px 0 6px; color: var(--shell-fg); }
      .hero .sub { font-size: 14px; color: var(--shell-fg-tertiary); margin: 0; }
      .section { padding: 20px 0; border-top: 1px solid var(--shell-border); }
      .section .row-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        font-weight: 500;
        margin-bottom: 4px;
      }
      .section .meta { font-size: 14px; color: var(--shell-fg-tertiary); margin: 0 0 16px; }
      .section .hint { font-size: 14px; color: var(--shell-fg-tertiary); margin: 0; }
      .badge {
        font-size: 12px;
        padding: 2px 10px;
        border-radius: 999px;
        border: 1px solid var(--shell-border);
        color: var(--shell-fg-secondary);
      }
      .badge.on { color: var(--shell-brand); border-color: var(--shell-brand); }
      .actions { display: flex; gap: 10px; align-items: center; }
      button.primary {
        height: 34px;
        padding: 0 18px;
        border: none;
        border-radius: 18px;
        background: var(--shell-brand);
        color: var(--shell-bg);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      button.primary:hover { background: var(--shell-brand-hover); }
      button.primary:disabled { opacity: 0.4; cursor: default; }
      button.ghost {
        height: 34px;
        padding: 0 18px;
        border-radius: 18px;
        background: transparent;
        color: var(--shell-fg);
        border: 1px solid var(--shell-border);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      button.ghost:hover { background: var(--shell-hover); }
      button.ghost:disabled { opacity: 0.4; cursor: default; }
      pre.log {
        margin: 14px 0 0;
        padding: 10px 12px;
        background: var(--shell-layer);
        border: 1px solid var(--shell-border);
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.5;
        color: var(--shell-fg-secondary);
        max-height: 200px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .error { color: var(--shell-danger); font-size: 13px; min-height: 20px; margin: 8px 0 0; }
    </style>
  </head>
  <body>
    <header class="titlebar">
      <button id="nav-back" class="btn-nav" title="后退" disabled>
        <svg viewBox="0 0 10 10"><path d="M6.5 1 2.5 5l4 4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="nav-forward" class="btn-nav" title="前进" disabled>
        <svg viewBox="0 0 10 10"><path d="M3.5 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <span class="status" id="title-status"></span>
      <div class="spacer"></div>
      <button id="settings" class="btn-settings" title="设置" hidden>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
          <circle cx="8" cy="8" r="2.4"/>
          <path d="M8 1.4v1.8M8 12.8v1.8M1.4 8h1.8M12.8 8h1.8M3.33 3.33l1.27 1.27M11.4 11.4l1.27 1.27M12.67 3.33l-1.27 1.27M4.6 11.4l-1.27 1.27"/>
        </svg>
      </button>
      <button id="min" title="最小化">
        <svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button id="max" title="最大化">
        <svg class="icon-max" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor"/></svg>
        <svg class="icon-restore" viewBox="0 0 10 10" hidden><path d="M2.5 2.5v-2h6v6h-2" fill="none" stroke="currentColor"/><rect x="0.5" y="2.5" width="6" height="6" fill="none" stroke="currentColor"/></svg>
      </button>
      <button id="close" class="close" title="关闭">
        <svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg>
      </button>
    </header>

    <main class="content">
      <div class="page">
        <div class="hero">
          <span class="logo"></span>
          <h1>DeepSeek Harness</h1>
          <p class="sub">桌面客户端 · 深度内嵌 dsh 运行时 · 与 npx dsh 等价</p>
        </div>

        <section class="section">
          <div class="row-title">本机实例 <span id="badge" class="badge">未知</span></div>
          <p class="meta" id="meta">未启动</p>
          <div class="actions">
            <button id="start" class="primary">启动内嵌 dsh</button>
            <button id="stop" class="ghost" disabled>停止</button>
            <button id="open" class="ghost" disabled>打开界面</button>
          </div>
          <p class="error" id="error"></p>
          <pre class="log" id="log" hidden></pre>
        </section>

        <section class="section">
          <div class="row-title">远程节点</div>
          <p class="hint">远程实例管理（代理注入 Bearer）将在下一版加入。</p>
        </section>
      </div>
    </main>

    <script>
      // ---- dsh alias token -> shell variable map (theme fusion) ----
      const TOKEN_MAP = {
        '--dsw-alias-bg-base': '--shell-bg',
        '--dsw-alias-bg-layer-1': '--shell-layer',
        '--dsw-alias-label-primary': '--shell-fg',
        '--dsw-alias-label-secondary': '--shell-fg-secondary',
        '--dsw-alias-label-tertiary': '--shell-fg-tertiary',
        '--dsw-alias-border-l2': '--shell-border',
        '--dsw-alias-interactive-bg-hover': '--shell-hover',
        '--dsw-alias-button-primary-fill': '--shell-brand',
        '--dsw-alias-button-primary-hover': '--shell-brand-hover',
        '--dsw-alias-state-error-primary': '--shell-danger',
        '--dsw-alias-state-success-primary': '--shell-success',
      }
      window.dshShell.onThemeSync((tokens) => {
        const root = document.documentElement
        for (const [alias, value] of Object.entries(tokens)) {
          const target = TOKEN_MAP[alias]
          if (target && value) root.style.setProperty(target, value)
        }
      })

      const badge = document.getElementById('badge')
      const meta = document.getElementById('meta')
      const error = document.getElementById('error')
      const log = document.getElementById('log')
      const startBtn = document.getElementById('start')
      const stopBtn = document.getElementById('stop')
      const openBtn = document.getElementById('open')
      const navBack = document.getElementById('nav-back')
      const navForward = document.getElementById('nav-forward')
      const settingsBtn = document.getElementById('settings')
      const titleStatus = document.getElementById('title-status')

      let current = null // { port, url }

      function setState(running, port, url) {
        current = running ? { port, url } : null
        badge.textContent = running ? '运行中' : '已停止'
        badge.classList.toggle('on', running)
        meta.textContent = running ? `http://127.0.0.1:${port}/` : '未启动'
        stopBtn.disabled = !running
        openBtn.disabled = !running
        startBtn.disabled = running
        titleStatus.textContent = running ? `· ${url}` : ''
      }

      async function refresh() {
        const s = await window.dshShell.status()
        setState(s.running, s.port, s.url)
        if (s.running) {
          const logs = await window.dshShell.logs()
          log.hidden = false
          log.textContent = logs.join('').slice(-4000)
          log.scrollTop = log.scrollHeight
        }
      }

      startBtn.addEventListener('click', async () => {
        error.textContent = ''
        startBtn.disabled = true
        startBtn.textContent = '启动中…'
        const result = await window.dshShell.startLocal()
        startBtn.textContent = '启动内嵌 dsh'
        if (result.ok) {
          setState(true, result.port, result.url)
          log.hidden = false
          log.textContent = (await window.dshShell.logs()).join('').slice(-4000)
        } else {
          setState(false)
          error.textContent = result.error || '启动失败'
          log.hidden = false
          log.textContent = (result.logs || []).join('').slice(-4000)
        }
      })

      stopBtn.addEventListener('click', async () => {
        await window.dshShell.stopLocal()
        setState(false)
      })

      openBtn.addEventListener('click', async () => {
        if (!current) return
        const r = await window.dshShell.connect(current.url)
        if (r.ok) {
          settingsBtn.hidden = false
          setNavState(await window.dshShell.nav.state())
        }
      })

      // title-bar back/forward control the connected dsh page's history
      function setNavState(state) {
        navBack.disabled = !state.canGoBack
        navForward.disabled = !state.canGoForward
      }
      navBack.addEventListener('click', () => window.dshShell.nav.back())
      navForward.addEventListener('click', () => window.dshShell.nav.forward())
      window.dshShell.nav.onChanged(setNavState)

      // settings returns to the launcher (management) panel
      settingsBtn.addEventListener('click', async () => {
        await window.dshShell.back()
        settingsBtn.hidden = true
        setNavState({ canGoBack: false, canGoForward: false })
      })

      // custom title bar controls
      document.getElementById('min').addEventListener('click', () => window.dshShell.window.minimize())
      document.getElementById('max').addEventListener('click', () => window.dshShell.window.toggleMaximize())
      document.getElementById('close').addEventListener('click', () => window.dshShell.window.close())

      async function syncMaximize() {
        const maximized = await window.dshShell.window.isMaximized()
        document.getElementById('max').classList.toggle('is-maximized', maximized)
        document.querySelector('.icon-max').hidden = maximized
        document.querySelector('.icon-restore').hidden = !maximized
      }
      window.dshShell.window.onMaximizedChanged(syncMaximize)
      syncMaximize()

      window.dshShell.onExited(() => {
        setState(false)
        settingsBtn.hidden = true
        setNavState({ canGoBack: false, canGoForward: false })
      })
      refresh()
    </script>
  </body>
</html>
