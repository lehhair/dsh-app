<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dsh app</title>
    <style>
      /* Shell palette = dsh alias tokens (light/dark defaults). While a dsh
         page is connected, view-preload samples the page's ACTUAL tokens and
         the shell overwrites these via theme:sync — so extension/version
         theme changes are followed, never hardcoded. */
      :root {
        color-scheme: light dark;
        --shell-bg: rgb(255, 255, 255);
        --shell-layer: rgb(255, 255, 255);
        --shell-layer-2: rgb(255, 255, 255);
        --shell-fg: rgb(15, 17, 21);
        --shell-fg-foreground: rgb(255, 255, 255);
        --shell-fg-secondary: rgb(97, 102, 107);
        --shell-fg-tertiary: rgb(129, 133, 140);
        --shell-border: rgba(0, 0, 0, 0.1);
        --shell-hover: rgba(38, 49, 72, 0.06);
        --shell-active: rgba(38, 49, 72, 0.1);
        --shell-brand: rgb(15, 17, 21);
        --shell-brand-hover: rgb(67, 69, 74);
        --shell-ghost-fill: rgb(235, 238, 242);
        --shell-ghost-border: rgb(151, 157, 166);
        --shell-scrollbar-thumb: rgb(229, 229, 229);
        --shell-scrollbar-thumb-hover: rgb(212, 212, 212);
        --shell-danger: rgb(236, 19, 19);
        --shell-success: rgb(34, 197, 94);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --shell-bg: rgb(21, 21, 23);
          --shell-layer: rgb(44, 44, 46);
          --shell-layer-2: rgb(44, 44, 46);
          --shell-fg: rgb(249, 250, 251);
          --shell-fg-foreground: rgb(15, 17, 21);
          --shell-fg-secondary: rgb(207, 211, 214);
          --shell-fg-tertiary: rgb(173, 178, 184);
          --shell-border: rgba(255, 255, 255, 0.12);
          --shell-hover: rgba(255, 255, 255, 0.08);
          --shell-active: rgba(255, 255, 255, 0.14);
          --shell-brand: rgb(249, 250, 251);
          --shell-brand-hover: rgb(235, 238, 242);
          --shell-ghost-fill: rgb(67, 69, 74);
          --shell-ghost-border: rgb(129, 133, 140);
          --shell-scrollbar-thumb: rgb(60, 60, 61);
          --shell-scrollbar-thumb-hover: rgb(84, 85, 87);
          --shell-danger: rgb(242, 90, 90);
          --shell-success: rgb(34, 197, 94);
        }
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      /* dsh scrollbar skin (mirrors ui-theme scrollbar.css): 8px slim bar,
         transparent track, 4px-radius thumb, hover deepens. */
      :root {
        --dsh-scrollbar-thumb: var(--shell-scrollbar-thumb);
        --dsh-scrollbar-thumb-hover: var(--shell-scrollbar-thumb-hover);
      }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { border-radius: 4px; background: var(--dsh-scrollbar-thumb); }
      ::-webkit-scrollbar-thumb:hover { background: var(--dsh-scrollbar-thumb-hover); }
      ::-webkit-scrollbar-corner { background: transparent; }
      /* Auto-hide on the remote list: thumb appears only while scrolling or
         hovered, fades out 500ms after the last scroll (JS adds .scrolling). */
      .remote-list::-webkit-scrollbar-thumb { background: transparent; transition: background-color 0.2s ease; }
      .remote-list:hover::-webkit-scrollbar-thumb,
      .remote-list.scrolling::-webkit-scrollbar-thumb { background: var(--dsh-scrollbar-thumb); }
      .remote-list:hover::-webkit-scrollbar-thumb:hover,
      .remote-list.scrolling::-webkit-scrollbar-thumb:hover { background: var(--dsh-scrollbar-thumb-hover); }
      @supports not selector(::-webkit-scrollbar) {
        body, body * { scrollbar-width: thin; scrollbar-color: var(--dsh-scrollbar-thumb) transparent; }
      }

      html, body { height: 100%; margin: 0; }
      body {
        background: var(--shell-bg);
        color: var(--shell-fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* fish logo via mask: color rides currentColor exactly like dsh's wordmark */
      .logo {
        display: inline-block;
        flex: none;
        background: currentColor;
        -webkit-mask: url(fish.svg) no-repeat center / contain;
        mask: url(fish.svg) no-repeat center / contain;
      }

      /* ---- title bar: fused with the page ground; compact 40px, window
         controls as rounded hover chips (mainstream Electron apps: VS Code /
         Slack / Obsidian style), inactive-window dimming ---- */
      .titlebar {
        height: 40px;
        flex: none;
        display: flex;
        align-items: center;
        background: var(--shell-bg);
        color: var(--shell-fg);
        user-select: none;
        -webkit-app-region: drag;
        /* right gutter for the OS-rendered window controls (titleBarOverlay) */
        padding-right: 150px;
      }
      .titlebar .status {
        font-size: 13px;
        font-weight: 500;
        line-height: 40px;
        color: var(--shell-fg-secondary);
        padding: 0 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .titlebar .spacer { flex: 1; }
      .titlebar .win-btn {
        -webkit-app-region: no-drag;
        width: 40px;
        height: 32px;
        margin: 0 2px;
        border: none;
        border-radius: 7px;
        background: transparent;
        color: var(--shell-fg-secondary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: default;
        transition: background-color 0.12s ease, color 0.12s ease;
      }
      .titlebar .win-btn svg { width: 12px; height: 12px; display: block; }
      .titlebar .win-btn.settings { width: 34px; margin-left: 8px; }
      .titlebar .win-btn.settings svg { width: 14px; height: 14px; }
      .titlebar .win-btn:hover:not(:disabled) { background: var(--shell-hover); color: var(--shell-fg); }
      .titlebar .win-btn:disabled { opacity: 0.35; }
      body.inactive .titlebar { opacity: 0.6; }

      /* ---- launcher content (dsh look: no card containers) ----
         Fixed head (hero + local instance) above; only the remote list
         scrolls — the page is a flex column and the remote section owns the
         remaining height. */
      .content {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        padding: 40px 24px 0;
      }
      .page {
        width: min(560px, 100%);
        height: 100%;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .hero { text-align: center; margin-bottom: 28px; flex: none; }
      .hero .logo { width: 40px; height: 30px; color: var(--shell-fg); }
      .hero h1 { font-size: 20px; font-weight: 500; margin: 14px 0 6px; color: var(--shell-fg); }
      .hero .sub { font-size: 14px; color: var(--shell-fg-tertiary); margin: 0; }
      .section { padding: 16px 0; border-top: 1px solid var(--shell-border); flex: none; }
      .section.remote {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding-bottom: 24px;
      }
      .section.remote > .row-title,
      .section.remote > .meta,
      .section.remote > .search-wrap,
      .section.remote > .remote-form { flex: none; }
      .remote-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        margin: 0 -24px;
        padding: 0 24px;
      }
      .section .row-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        font-weight: 500;
        margin-bottom: 4px;
      }
      .section .meta { font-size: 14px; color: var(--shell-fg-tertiary); margin: 0 0 16px; }
      .section .hint { font-size: 14px; color: var(--shell-fg-tertiary); margin: 0; }
      .actions { display: flex; gap: 8px; align-items: center; }
      .field-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .field {
        height: 36px;
        padding: 0 12px;
        border: 1px solid var(--shell-border);
        border-radius: 8px;
        background: var(--shell-layer);
        color: var(--shell-fg);
        font: inherit;
        font-size: 13px;
        outline: none;
        min-width: 180px;
      }
      /* elasticity only inside a form row; standalone fields (search) stay
         natural height even inside a flex column */
      .field-row > .field { flex: 1 1 200px; }
      .field:focus { border-color: var(--shell-brand); }
      .field::placeholder { color: var(--shell-fg-tertiary); }

      /* remote instance rows (dsh look: divider rows, no cards) */
      .instance-row {
        padding: 14px 0;
        border-top: 1px solid var(--shell-border);
      }
      .instance-row:first-child { border-top: none; }
      .instance-row .row-title { margin-bottom: 4px; }
      .instance-row .meta { margin: 0 0 10px; font-size: 13px; }
      .remote-form {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--shell-border);
      }

      /* dsh Button sm (28px capsule) for row actions */
      .btn.sm {
        height: 28px;
        font-size: 12px;
        line-height: 18px;
        padding: 0 10px;
        border-radius: 14px;
      }

      /* dsh Button (figma 1:155): h36 capsule, pad 14, gap 4, r18 */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        border: none;
        border-radius: 18px;
        cursor: pointer;
        font-size: 14px;
        line-height: 22px;
        color: var(--shell-fg);
        background: transparent;
        padding: 0 14px;
        height: 36px;
        font-family: inherit;
      }
      .btn:disabled { cursor: not-allowed; opacity: 0.4; }
      .btn.primary {
        background: var(--shell-brand);
        color: var(--shell-fg-foreground);
      }
      .btn.primary:hover:not(:disabled) { background: var(--shell-brand-hover); }
      .btn.ghost:hover:not(:disabled) { background: var(--shell-hover); }
      .btn.ghost:active:not(:disabled) { background: var(--shell-active); }
      .btn.outline { border: 1px solid var(--shell-border); background: transparent; }
      .btn.outline:hover:not(:disabled) { background: var(--shell-hover); }

      /* dsh Pill: h24 r12, label-secondary on layer-2; active = ghost-active fill + inset ring */
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 24px;
        padding: 0 8px;
        border: none;
        border-radius: 12px;
        font-size: 12px;
        line-height: 18px;
        color: var(--shell-fg-secondary);
        background: var(--shell-layer-2);
      }
      .pill.on {
        color: var(--shell-fg);
        background: var(--shell-ghost-fill);
        box-shadow: inset 0 0 0 1px var(--shell-ghost-border);
      }

      /* dsh StateDot: same-color halo + solid core riding currentColor.
         Integer-pixel pseudo-element insets (not percentages) so no DPI
         sub-pixel rounding can shear the circle into an ellipse; explicit
         flex-shrink:0 so a flex row can never squash it. */
      .dot {
        position: relative;
        display: inline-block;
        flex: none;
        flex-shrink: 0;
        width: 10px;
        height: 10px;
        min-width: 10px;
        min-height: 10px;
      }
      .dot::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.1;
      }
      .dot::after {
        content: '';
        position: absolute;
        inset: 2px;
        border-radius: 50%;
        background: currentColor;
      }
      .dot.done { color: var(--shell-success); }
      /* `danger`, not `error`: `error` collides with the generic message
         style (.error min-height: 20px) and would shear the dot into an
         ellipse. */
      .dot.danger { color: var(--shell-danger); }
      .pill svg { width: 12px; height: 12px; display: block; }
      .pill svg rect { fill: currentColor; opacity: 0.15; animation: dsh-state-dot-chase 1s infinite; }
      @keyframes dsh-state-dot-chase {
        0%, 12.4% { opacity: 1; }
        12.5%, 24.9% { opacity: 0.6; }
        25%, 37.4% { opacity: 0.35; }
        37.5%, 100% { opacity: 0.15; }
      }
      pre.log {
        margin: 14px 0 0;
        padding: 10px 12px;
        background: var(--shell-layer);
        border: 1px solid var(--shell-border);
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.5;
        color: var(--shell-fg-secondary);
        max-height: 200px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .error { color: var(--shell-danger); font-size: 13px; min-height: 20px; margin: 8px 0 0; }
    </style>
  </head>
  <body>
    <header class="titlebar">
      <button id="settings" class="win-btn settings" title="设置" hidden>
        <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
    <g clipPath="url(#shell-icon-settings-clip)">

      </button>
      <span class="status" id="title-status">DeepSeek Harness</span>
      <div class="spacer"></div>
    </header>

    <main class="content">
      <div class="page">
        <div class="hero">
          <span class="logo"></span>
          <h1>DeepSeek Harness</h1>
          <p class="sub">桌面客户端 · 深度内嵌 dsh 运行时 · 与 npx dsh 等价</p>
        </div>

        <section class="section">
          <div class="row-title">本机实例 <span id="badge" class="pill">未知</span></div>
          <p class="meta" id="meta">未启动</p>
          <div class="actions">
            <button id="start" class="btn primary">启动内嵌 dsh</button>
            <button id="stop" class="btn ghost" disabled>停止</button>
            <button id="open" class="btn outline" disabled>打开界面</button>
          </div>
          <p class="error" id="error"></p>
          <pre class="log" id="log" hidden></pre>
        </section>

        <section class="section remote">
          <div class="row-title">远程节点 <button id="remote-add" class="btn sm outline">添加实例</button></div>
          <p class="meta">连接远程 dsh（经网关，访问密钥注入）；可添加、保存、切换多个节点。</p>
          <p class="error" id="remote-error" style="min-height:0;margin:0 0 8px"></p>
          <input id="remote-search" class="field" placeholder="搜索实例（名称 / 地址）" spellcheck="false" style="margin-bottom:4px" />
          <div id="remote-list" class="remote-list"></div>
          <div id="remote-form" class="remote-form" hidden>
            <div class="field-row">
              <input id="rf-name" class="field" placeholder="名称，如 书房网关" spellcheck="false" />
              <input id="rf-url" class="field" placeholder="http://192.168.1.233:8443" spellcheck="false" />
              <input id="rf-key" class="field" type="password" placeholder="访问密钥（留空保留）" />
            </div>
            <div class="actions" style="margin-top:10px">
              <button id="rf-save" class="btn primary">保存</button>
              <button id="rf-cancel" class="btn ghost">取消</button>
            </div>
            <p class="error" id="rf-error"></p>
          </div>
        </section>
      </div>
    </main>

    <script>
      // ---- dsh alias token -> shell variable map (theme fusion) ----
      const TOKEN_MAP = {
        '--dsw-alias-bg-base': '--shell-bg',
        '--dsw-alias-bg-layer-1': '--shell-layer',
        '--dsw-alias-bg-layer-2': '--shell-layer-2',
        '--dsw-alias-label-primary': '--shell-fg',
        '--dsw-alias-label-primary-foreground': '--shell-fg-foreground',
        '--dsw-alias-label-secondary': '--shell-fg-secondary',
        '--dsw-alias-label-tertiary': '--shell-fg-tertiary',
        '--dsw-alias-border-l2': '--shell-border',
        '--dsw-alias-interactive-bg-hover': '--shell-hover',
        '--dsw-alias-interactive-bg-active': '--shell-active',
        '--dsw-alias-button-primary-fill': '--shell-brand',
        '--dsw-alias-button-primary-hover': '--shell-brand-hover',
        '--dsw-alias-button-ghost-active-fill': '--shell-ghost-fill',
        '--dsw-alias-button-ghost-active-border': '--shell-ghost-border',
        '--dsw-alias-scrollbar-bg-l1': '--shell-scrollbar-thumb',
        '--dsw-alias-scrollbar-hover-l1': '--shell-scrollbar-thumb-hover',
        '--dsw-alias-state-error-primary': '--shell-danger',
        '--dsw-alias-state-success-primary': '--shell-success',
      }
      window.dshShell.onThemeSync((tokens) => {
        const root = document.documentElement
        for (const [alias, value] of Object.entries(tokens)) {
          const target = TOKEN_MAP[alias]
          if (target && value) root.style.setProperty(target, value)
        }
      })

      const badge = document.getElementById('badge')
      const meta = document.getElementById('meta')
      const error = document.getElementById('error')
      const log = document.getElementById('log')
      const startBtn = document.getElementById('start')
      const stopBtn = document.getElementById('stop')
      const openBtn = document.getElementById('open')
      const settingsBtn = document.getElementById('settings')
      const titleStatus = document.getElementById('title-status')

      let current = null // { port, url }

      function setBadge(state, text) {
        badge.textContent = ''
        if (state === 'ongoing') {
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
          svg.setAttribute('viewBox', '0 0 10 10')
          svg.setAttribute('shape-rendering', 'crispEdges')
          for (const [x, y] of [[0, 0], [4, 0], [8, 0], [8, 4], [8, 8], [4, 8], [0, 8], [0, 4]]) {
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
            rect.setAttribute('x', x)
            rect.setAttribute('y', y)
            rect.setAttribute('width', 2)
            rect.setAttribute('height', 2)
            svg.appendChild(rect)
          }
          badge.appendChild(svg)
        } else if (state === 'done' || state === 'error') {
          const dot = document.createElement('span')
          dot.className = `dot ${state}`
          badge.appendChild(dot)
        }
        badge.appendChild(document.createTextNode(text))
        badge.classList.toggle('on', state === 'done')
      }

      // status: 'idle' | 'starting' | 'running' | 'error'
      function setState(status, port, url) {
        current = status === 'running' ? { port, url } : null
        if (status === 'running') setBadge('done', '运行中')
        else if (status === 'starting') setBadge('ongoing', '启动中')
        else if (status === 'error') setBadge('error', '启动失败')
        else setBadge(null, '已停止')
        meta.textContent = status === 'running' ? `http://127.0.0.1:${port}/` : '未启动'
        const running = status === 'running'
        stopBtn.disabled = !running
        openBtn.disabled = !running
        startBtn.disabled = running || status === 'starting'
        titleStatus.textContent = running ? url : 'DeepSeek Harness'
      }

      async function refresh() {
        const s = await window.dshShell.status()
        setState(s.running ? 'running' : 'idle', s.port, s.url)
        if (s.running) {
          const logs = await window.dshShell.logs()
          log.hidden = false
          log.textContent = logs.join('').slice(-4000)
          log.scrollTop = log.scrollHeight
        }
      }

      startBtn.addEventListener('click', async () => {
        error.textContent = ''
        setState('starting')
        const result = await window.dshShell.startLocal()
        if (result.ok) {
          setState('running', result.port, result.url)
          log.hidden = false
          log.textContent = (await window.dshShell.logs()).join('').slice(-4000)
        } else {
          setState('error')
          error.textContent = result.error || '启动失败'
          log.hidden = false
          log.textContent = (result.logs || []).join('').slice(-4000)
        }
      })

      stopBtn.addEventListener('click', async () => {
        await window.dshShell.stopLocal()
        setState('idle')
      })

      openBtn.addEventListener('click', async () => {
        if (!current) return
        const r = await window.dshShell.connect(current.url)
        if (r.ok) settingsBtn.hidden = false
      })

      // ---- remote node registry: add / save / switch ----
      const remoteList = document.getElementById('remote-list')
      // auto-hide scrollbar: visible while scrolling, fades 500ms after stop
      let scrollHideTimer = null
      remoteList.addEventListener('scroll', () => {
        remoteList.classList.add('scrolling')
        clearTimeout(scrollHideTimer)
        scrollHideTimer = setTimeout(() => remoteList.classList.remove('scrolling'), 500)
      })
      const remoteAddBtn = document.getElementById('remote-add')
      const remoteForm = document.getElementById('remote-form')
      const rfName = document.getElementById('rf-name')
      const rfUrl = document.getElementById('rf-url')
      const rfKey = document.getElementById('rf-key')
      const rfSave = document.getElementById('rf-save')
      const rfCancel = document.getElementById('rf-cancel')
      const rfError = document.getElementById('rf-error')
      let editingId = null

      function makeBtn(text, cls, fn) {
        const button = document.createElement('button')
        button.className = `btn ${cls}`
        button.textContent = text
        button.addEventListener('click', fn)
        return button
      }

      async function connectRemoteById(id) {
        remoteError.textContent = ''
        const r = await window.dshShell.remote.connect(id)
        if (r.ok) settingsBtn.hidden = false
        else remoteError.textContent = r.error || '连接失败'
      }

      const remoteSearch = document.getElementById('remote-search')
      const remoteError = document.getElementById('remote-error')
      const healthCache = new Map() // instanceId -> { status, at } (30s TTL)

      function applyHealth(dot, status) {
        dot.className = status === 'online' ? 'dot done'
          : status === 'unauthorized' ? 'dot danger'
          : 'dot'
        dot.title = status === 'online' ? '在线'
          : status === 'unauthorized' ? '密钥无效'
          : '离线'
      }

      async function refreshHealth(id, dot) {
        const cached = healthCache.get(id)
        if (cached && Date.now() - cached.at < 30_000) {
          applyHealth(dot, cached.status)
          return
        }
        const h = await window.dshShell.remote.health(id)
        healthCache.set(id, { status: h.status, at: Date.now() })
        applyHealth(dot, h.status)
      }

      async function renderRemoteList() {
        const query = remoteSearch.value.trim().toLowerCase()
        const instances = await window.dshShell.remote.list()
        remoteList.textContent = ''
        const matches = query
          ? instances.filter((inst) =>
              inst.name.toLowerCase().includes(query) || inst.url.toLowerCase().includes(query))
          : instances
        for (const inst of matches) {
          const row = document.createElement('div')
          row.className = 'instance-row'

          const line1 = document.createElement('div')
          line1.className = 'row-title'
          const healthDot = document.createElement('span')
          healthDot.className = 'dot'
          healthDot.title = '检测中'
          line1.appendChild(healthDot)
          const name = document.createElement('span')
          name.textContent = inst.name
          line1.appendChild(name)
          if (inst.isDefault) {
            const pill = document.createElement('span')
            pill.className = 'pill'
            pill.textContent = '默认'
            line1.appendChild(pill)
          }
          row.appendChild(line1)

          const meta = document.createElement('p')
          meta.className = 'meta'
          meta.textContent = `${inst.url} · 密钥${inst.keyConfigured ? '已配置' : '未配置'}`
          row.appendChild(meta)

          const actions = document.createElement('div')
          actions.className = 'actions'
          actions.appendChild(makeBtn('连接', 'primary sm', () => connectRemoteById(inst.id)))
          const defaultBtn = makeBtn(inst.isDefault ? '默认' : '设为默认', 'ghost sm', async () => {
            await window.dshShell.remote.setDefault(inst.id)
            renderRemoteList()
          })
          defaultBtn.disabled = inst.isDefault
          actions.appendChild(defaultBtn)
          actions.appendChild(makeBtn('编辑', 'ghost sm', () => openRemoteForm(inst)))
          actions.appendChild(makeBtn('删除', 'ghost sm', async () => {
            await window.dshShell.remote.remove(inst.id)
            renderRemoteList()
          }))
          row.appendChild(actions)

          remoteList.appendChild(row)
          void refreshHealth(inst.id, healthDot)
        }
        if (remoteList.children.length === 0) {
          const empty = document.createElement('p')
          empty.className = 'hint'
          empty.textContent = query ? '没有匹配的实例' : '还没有远程实例，点击上方"添加实例"'
          remoteList.appendChild(empty)
        }
      }

      remoteSearch.addEventListener('input', () => renderRemoteList())

      function openRemoteForm(inst) {
        editingId = inst?.id ?? null
        rfName.value = inst?.name ?? ''
        rfUrl.value = inst?.url ?? ''
        rfKey.value = ''
        rfError.textContent = ''
        remoteForm.hidden = false
        rfName.focus()
      }

      remoteAddBtn.addEventListener('click', () => openRemoteForm(null))
      rfCancel.addEventListener('click', () => { remoteForm.hidden = true })

      rfSave.addEventListener('click', async () => {
        rfError.textContent = ''
        const r = await window.dshShell.remote.save({
          id: editingId ?? undefined,
          name: rfName.value,
          url: rfUrl.value,
          key: rfKey.value,
        })
        if (r.ok) {
          remoteForm.hidden = true
          editingId = null
          renderRemoteList()
        } else {
          rfError.textContent = r.error || '保存失败'
        }
      })

      // settings opens the settings dialog window
      settingsBtn.addEventListener('click', async () => {
        await window.dshShell.settings.open()
      })

      // Window controls (minimize/maximize/close) are rendered by the OS via
      // titleBarOverlay — nothing to wire here; the drag region handles moves.

      window.dshShell.onExited(() => {
        setState('idle')
        settingsBtn.hidden = true
      })
      window.dshShell.onBacked(() => { settingsBtn.hidden = true })
      refresh()
      renderRemoteList()

      // inactive-window dimming (mainstream title-bar behavior)
      const syncActive = () => document.body.classList.toggle('inactive', !document.hasFocus())
      window.addEventListener('focus', syncActive)
      window.addEventListener('blur', syncActive)
      syncActive()
    </script>
  </body>
</html>
