<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dsh app</title>
    <style>
      /* Shell palette = dsh alias tokens (light/dark defaults). While a dsh
         page is connected, view-preload samples the page's ACTUAL tokens and
         the shell overwrites these via theme:sync — so extension/version
         theme changes are followed, never hardcoded. */
      :root {
        color-scheme: light dark;
        --shell-bg: rgb(255, 255, 255);
        --shell-layer: rgb(255, 255, 255);
        --shell-layer-2: rgb(255, 255, 255);
        --shell-fg: rgb(15, 17, 21);
        --shell-fg-foreground: rgb(255, 255, 255);
        --shell-fg-secondary: rgb(97, 102, 107);
        --shell-fg-tertiary: rgb(129, 133, 140);
        --shell-border: rgba(0, 0, 0, 0.1);
        --shell-hover: rgba(38, 49, 72, 0.06);
        --shell-active: rgba(38, 49, 72, 0.1);
        --shell-brand: rgb(15, 17, 21);
        --shell-brand-hover: rgb(67, 69, 74);
        --shell-ghost-fill: rgb(235, 238, 242);
        --shell-ghost-border: rgb(151, 157, 166);
        --shell-danger: rgb(236, 19, 19);
        --shell-success: rgb(34, 197, 94);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --shell-bg: rgb(21, 21, 23);
          --shell-layer: rgb(44, 44, 46);
          --shell-layer-2: rgb(44, 44, 46);
          --shell-fg: rgb(249, 250, 251);
          --shell-fg-foreground: rgb(15, 17, 21);
          --shell-fg-secondary: rgb(207, 211, 214);
          --shell-fg-tertiary: rgb(173, 178, 184);
          --shell-border: rgba(255, 255, 255, 0.12);
          --shell-hover: rgba(255, 255, 255, 0.08);
          --shell-active: rgba(255, 255, 255, 0.14);
          --shell-brand: rgb(249, 250, 251);
          --shell-brand-hover: rgb(235, 238, 242);
          --shell-ghost-fill: rgb(67, 69, 74);
          --shell-ghost-border: rgb(129, 133, 140);
          --shell-danger: rgb(242, 90, 90);
          --shell-success: rgb(34, 197, 94);
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--shell-bg);
        color: var(--shell-fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* fish logo via mask: color rides currentColor exactly like dsh's wordmark */
      .logo {
        display: inline-block;
        flex: none;
        background: currentColor;
        -webkit-mask: url(fish.svg) no-repeat center / contain;
        mask: url(fish.svg) no-repeat center / contain;
      }

      /* ---- title bar: fused with the page ground; compact 40px, window
         controls as rounded hover chips (mainstream Electron apps: VS Code /
         Slack / Obsidian style), inactive-window dimming ---- */
      .titlebar {
        height: 40px;
        flex: none;
        display: flex;
        align-items: center;
        background: var(--shell-bg);
        color: var(--shell-fg);
        user-select: none;
        -webkit-app-region: drag;
      }
      .titlebar .status {
        font-size: 13px;
        font-weight: 500;
        color: var(--shell-fg-secondary);
        padding: 0 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .titlebar .spacer { flex: 1; }
      .titlebar .win-btn {
        -webkit-app-region: no-drag;
        width: 40px;
        height: 32px;
        margin: 0 2px;
        border: none;
        border-radius: 7px;
        background: transparent;
        color: var(--shell-fg-secondary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: default;
        transition: background-color 0.12s ease, color 0.12s ease;
      }
      .titlebar .win-btn svg { width: 12px; height: 12px; display: block; }
      .titlebar .win-btn.settings { width: 34px; }
      .titlebar .win-btn.settings svg { width: 14px; height: 14px; }
      .titlebar .win-btn:hover:not(:disabled) { background: var(--shell-hover); color: var(--shell-fg); }
      .titlebar .win-btn.close:hover:not(:disabled) { background: var(--shell-danger); color: #fff; }
      .titlebar .win-btn:disabled { opacity: 0.35; }
      body.inactive .titlebar { opacity: 0.6; }

      /* ---- launcher content (dsh look: no card containers) ---- */
      .content {
        flex: 1;
        min-height: 0;
        overflow: auto;
        display: flex;
        justify-content: center;
        padding: 56px 24px 40px;
      }
      .page { width: min(520px, 100%); }
      .hero { text-align: center; margin-bottom: 40px; }
      .hero .logo { width: 40px; height: 30px; color: var(--shell-fg); }
      .hero h1 { font-size: 20px; font-weight: 500; margin: 14px 0 6px; color: var(--shell-fg); }
      .hero .sub { font-size: 14px; color: var(--shell-fg-tertiary); margin: 0; }
      .section { padding: 20px 0; border-top: 1px solid var(--shell-border); }
      .section .row-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        font-weight: 500;
        margin-bottom: 4px;
      }
      .section .meta { font-size: 14px; color: var(--shell-fg-tertiary); margin: 0 0 16px; }
      .section .hint { font-size: 14px; color: var(--shell-fg-tertiary); margin: 0; }
      .actions { display: flex; gap: 8px; align-items: center; }

      /* dsh Button (figma 1:155): h36 capsule, pad 14, gap 4, r18 */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        border: none;
        border-radius: 18px;
        cursor: pointer;
        font-size: 14px;
        line-height: 22px;
        color: var(--shell-fg);
        background: transparent;
        padding: 0 14px;
        height: 36px;
        font-family: inherit;
      }
      .btn:disabled { cursor: not-allowed; opacity: 0.4; }
      .btn.primary {
        background: var(--shell-brand);
        color: var(--shell-fg-foreground);
      }
      .btn.primary:hover:not(:disabled) { background: var(--shell-brand-hover); }
      .btn.ghost:hover:not(:disabled) { background: var(--shell-hover); }
      .btn.ghost:active:not(:disabled) { background: var(--shell-active); }
      .btn.outline { border: 1px solid var(--shell-border); background: transparent; }
      .btn.outline:hover:not(:disabled) { background: var(--shell-hover); }

      /* dsh Pill: h24 r12, label-secondary on layer-2; active = ghost-active fill + inset ring */
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 24px;
        padding: 0 8px;
        border: none;
        border-radius: 12px;
        font-size: 12px;
        line-height: 18px;
        color: var(--shell-fg-secondary);
        background: var(--shell-layer-2);
      }
      .pill.on {
        color: var(--shell-fg);
        background: var(--shell-ghost-fill);
        box-shadow: inset 0 0 0 1px var(--shell-ghost-border);
      }

      /* dsh StateDot: same-color halo + solid core riding currentColor */
      .dot {
        position: relative;
        display: inline-block;
        flex: none;
        width: 10px;
        height: 10px;
      }
      .dot::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.1;
      }
      .dot::after {
        content: '';
        position: absolute;
        inset: 20%;
        border-radius: 50%;
        background: currentColor;
      }
      .dot.done { color: var(--shell-success); }
      .dot.error { color: var(--shell-danger); }
      .pill svg { width: 12px; height: 12px; display: block; }
      .pill svg rect { fill: currentColor; opacity: 0.15; animation: dsh-state-dot-chase 1s infinite; }
      @keyframes dsh-state-dot-chase {
        0%, 12.4% { opacity: 1; }
        12.5%, 24.9% { opacity: 0.6; }
        25%, 37.4% { opacity: 0.35; }
        37.5%, 100% { opacity: 0.15; }
      }
      pre.log {
        margin: 14px 0 0;
        padding: 10px 12px;
        background: var(--shell-layer);
        border: 1px solid var(--shell-border);
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.5;
        color: var(--shell-fg-secondary);
        max-height: 200px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .error { color: var(--shell-danger); font-size: 13px; min-height: 20px; margin: 8px 0 0; }
    </style>
  </head>
  <body>
    <header class="titlebar">
      <span class="status" id="title-status">DeepSeek Harness</span>
      <div class="spacer"></div>
      <button id="settings" class="win-btn settings" title="设置" hidden>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
          <circle cx="8" cy="8" r="2.4"/>
          <path d="M8 1.4v1.8M8 12.8v1.8M1.4 8h1.8M12.8 8h1.8M3.33 3.33l1.27 1.27M11.4 11.4l1.27 1.27M12.67 3.33l-1.27 1.27M4.6 11.4l-1.27 1.27"/>
        </svg>
      </button>
      <button id="min" class="win-btn" title="最小化">
        <svg viewBox="0 0 12 12"><path d="M1.5 6h9" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
      </button>
      <button id="max" class="win-btn" title="最大化">
        <svg class="icon-max" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
        <svg class="icon-restore" viewBox="0 0 12 12" hidden><path d="M4 4V1.5h6.5V8H8" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="1.5" y="4" width="6.5" height="6.5" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
      </button>
      <button id="close" class="win-btn close" title="关闭">
        <svg viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
      </button>
    </header>

    <main class="content">
      <div class="page">
        <div class="hero">
          <span class="logo"></span>
          <h1>DeepSeek Harness</h1>
          <p class="sub">桌面客户端 · 深度内嵌 dsh 运行时 · 与 npx dsh 等价</p>
        </div>

        <section class="section">
          <div class="row-title">本机实例 <span id="badge" class="pill">未知</span></div>
          <p class="meta" id="meta">未启动</p>
          <div class="actions">
            <button id="start" class="btn primary">启动内嵌 dsh</button>
            <button id="stop" class="btn ghost" disabled>停止</button>
            <button id="open" class="btn outline" disabled>打开界面</button>
          </div>
          <p class="error" id="error"></p>
          <pre class="log" id="log" hidden></pre>
        </section>

        <section class="section">
          <div class="row-title">远程节点</div>
          <p class="hint">远程实例管理（代理注入 Bearer）将在下一版加入。</p>
        </section>
      </div>
    </main>

    <script>
      // ---- dsh alias token -> shell variable map (theme fusion) ----
      const TOKEN_MAP = {
        '--dsw-alias-bg-base': '--shell-bg',
        '--dsw-alias-bg-layer-1': '--shell-layer',
        '--dsw-alias-bg-layer-2': '--shell-layer-2',
        '--dsw-alias-label-primary': '--shell-fg',
        '--dsw-alias-label-primary-foreground': '--shell-fg-foreground',
        '--dsw-alias-label-secondary': '--shell-fg-secondary',
        '--dsw-alias-label-tertiary': '--shell-fg-tertiary',
        '--dsw-alias-border-l2': '--shell-border',
        '--dsw-alias-interactive-bg-hover': '--shell-hover',
        '--dsw-alias-interactive-bg-active': '--shell-active',
        '--dsw-alias-button-primary-fill': '--shell-brand',
        '--dsw-alias-button-primary-hover': '--shell-brand-hover',
        '--dsw-alias-button-ghost-active-fill': '--shell-ghost-fill',
        '--dsw-alias-button-ghost-active-border': '--shell-ghost-border',
        '--dsw-alias-state-error-primary': '--shell-danger',
        '--dsw-alias-state-success-primary': '--shell-success',
      }
      window.dshShell.onThemeSync((tokens) => {
        const root = document.documentElement
        for (const [alias, value] of Object.entries(tokens)) {
          const target = TOKEN_MAP[alias]
          if (target && value) root.style.setProperty(target, value)
        }
      })

      const badge = document.getElementById('badge')
      const meta = document.getElementById('meta')
      const error = document.getElementById('error')
      const log = document.getElementById('log')
      const startBtn = document.getElementById('start')
      const stopBtn = document.getElementById('stop')
      const openBtn = document.getElementById('open')
      const settingsBtn = document.getElementById('settings')
      const titleStatus = document.getElementById('title-status')

      let current = null // { port, url }

      function setBadge(state, text) {
        badge.textContent = ''
        if (state === 'ongoing') {
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
          svg.setAttribute('viewBox', '0 0 10 10')
          svg.setAttribute('shape-rendering', 'crispEdges')
          for (const [x, y] of [[0, 0], [4, 0], [8, 0], [8, 4], [8, 8], [4, 8], [0, 8], [0, 4]]) {
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect')
            rect.setAttribute('x', x)
            rect.setAttribute('y', y)
            rect.setAttribute('width', 2)
            rect.setAttribute('height', 2)
            svg.appendChild(rect)
          }
          badge.appendChild(svg)
        } else if (state === 'done' || state === 'error') {
          const dot = document.createElement('span')
          dot.className = `dot ${state}`
          badge.appendChild(dot)
        }
        badge.appendChild(document.createTextNode(text))
        badge.classList.toggle('on', state === 'done')
      }

      // status: 'idle' | 'starting' | 'running' | 'error'
      function setState(status, port, url) {
        current = status === 'running' ? { port, url } : null
        if (status === 'running') setBadge('done', '运行中')
        else if (status === 'starting') setBadge('ongoing', '启动中')
        else if (status === 'error') setBadge('error', '启动失败')
        else setBadge(null, '已停止')
        meta.textContent = status === 'running' ? `http://127.0.0.1:${port}/` : '未启动'
        const running = status === 'running'
        stopBtn.disabled = !running
        openBtn.disabled = !running
        startBtn.disabled = running || status === 'starting'
        titleStatus.textContent = running ? url : 'DeepSeek Harness'
      }

      async function refresh() {
        const s = await window.dshShell.status()
        setState(s.running ? 'running' : 'idle', s.port, s.url)
        if (s.running) {
          const logs = await window.dshShell.logs()
          log.hidden = false
          log.textContent = logs.join('').slice(-4000)
          log.scrollTop = log.scrollHeight
        }
      }

      startBtn.addEventListener('click', async () => {
        error.textContent = ''
        setState('starting')
        const result = await window.dshShell.startLocal()
        if (result.ok) {
          setState('running', result.port, result.url)
          log.hidden = false
          log.textContent = (await window.dshShell.logs()).join('').slice(-4000)
        } else {
          setState('error')
          error.textContent = result.error || '启动失败'
          log.hidden = false
          log.textContent = (result.logs || []).join('').slice(-4000)
        }
      })

      stopBtn.addEventListener('click', async () => {
        await window.dshShell.stopLocal()
        setState('idle')
      })

      openBtn.addEventListener('click', async () => {
        if (!current) return
        const r = await window.dshShell.connect(current.url)
        if (r.ok) settingsBtn.hidden = false
      })

      // settings returns to the launcher (management) panel
      settingsBtn.addEventListener('click', async () => {
        await window.dshShell.back()
        settingsBtn.hidden = true
      })

      // custom title bar controls
      document.getElementById('min').addEventListener('click', () => window.dshShell.window.minimize())
      document.getElementById('max').addEventListener('click', () => window.dshShell.window.toggleMaximize())
      document.getElementById('close').addEventListener('click', () => window.dshShell.window.close())

      async function syncMaximize() {
        const maximized = await window.dshShell.window.isMaximized()
        document.getElementById('max').classList.toggle('is-maximized', maximized)
        document.querySelector('.icon-max').hidden = maximized
        document.querySelector('.icon-restore').hidden = !maximized
      }
      window.dshShell.window.onMaximizedChanged(syncMaximize)
      syncMaximize()

      window.dshShell.onExited(() => {
        setState('idle')
        settingsBtn.hidden = true
      })
      refresh()

      // inactive-window dimming (mainstream title-bar behavior)
      const syncActive = () => document.body.classList.toggle('inactive', !document.hasFocus())
      window.addEventListener('focus', syncActive)
      window.addEventListener('blur', syncActive)
      syncActive()
    </script>
  </body>
</html>
