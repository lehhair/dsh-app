name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # Desktop: BOTH flavors per platform — external (uses the PC's own
  # node + global dsh) and bundled (embeds node + .dsh-runtime).
  # ---------------------------------------------------------------
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libfuse2

      - name: Install npm dependencies
        run: npm ci

      - name: Build external flavor
        shell: bash
        run: |
          node scripts/bundle-resources.mjs --external
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            # NSIS only — WiX light on the MSI target is pathologically slow
            # even on the small external payload; NSIS covers Windows.
            npm run tauri -- build --bundles nsis
          else
            npm run tauri -- build
          fi
          mkdir -p release/external
          cp -r src-tauri/target/release/bundle/* release/external/ 2>/dev/null || true
          # standalone binary (small update payload for the launcher updater)
          cp src-tauri/target/release/dsh-app* release/external/ 2>/dev/null || true

      # Bundled flavor is Windows-only: macOS/Linux users just need the
      # launcher (external flavor — their own node + global dsh). The bundled
      # installer ships node + npm only; the dsh runtime is installed on
      # demand inside the shell (安装 dsh button) into the user-data dir.
      - name: Build bundled flavor
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          node scripts/bundle-resources.mjs
          # NSIS only — WiX light stalls for 10+ minutes linking the huge
          # payload into the MSI; NSIS covers Windows installs.
          npm run tauri -- build --bundles nsis
          mkdir -p release/bundled
          cp -r src-tauri/target/release/bundle/* release/bundled/ 2>/dev/null || true
          cp src-tauri/target/release/dsh-app* release/bundled/ 2>/dev/null || true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: release
          retention-days: 1

  # ---------------------------------------------------------------
  # Android: arm64 only (no v7) — the tauri CLI flow works natively on
  # the Linux runner (the Windows Developer-Mode symlink issue does not
  # apply here). Signing is driven by ANDROID_KEY_* secrets; without
  # them the unsigned APK is still built and uploaded.
  # ---------------------------------------------------------------
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;29.0.14206865"

      - name: Install Rust stable + android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android-arm64

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            src-tauri/gen/android/.gradle
          key: gradle-arm64-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-arm64-

      - name: Install npm dependencies
        run: npm ci

      - name: Configure release signing (when secrets present)
        if: ${{ env.ANDROID_KEY_ALIAS != '' }}
        run: |
          cd src-tauri/gen/android
          echo "keyAlias=$ANDROID_KEY_ALIAS" > keystore.properties
          echo "password=$ANDROID_KEY_PASSWORD" >> keystore.properties
          echo "$ANDROID_KEY_BASE64" | base64 -d > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: Build APK (arm64)
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          # --split-per-abi produces the per-ABI APKs (arm64 dir); --target
          # aarch64 limits the rust build to arm64
          npx tauri android build --apk --split-per-abi --target aarch64

      - name: Sign APK
        shell: bash
        run: |
          mkdir -p release
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -path '*/arm64/release/*' -name '*.apk' -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "no release APK found"; exit 1; fi
          BT="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | tail -1)"
          if $BT/apksigner verify "$APK" 2>/dev/null; then
            cp "$APK" release/dsh-app-android-arm64.apk
          else
            echo "::error::APK is unsigned — the Android signing key MUST be stable across builds (Android refuses signature changes on update). Set the ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD / ANDROID_KEY_BASE64 secrets from a keystore you keep safe."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: release
          retention-days: 1

  # ---------------------------------------------------------------
  # Release: every successful master build updates the v<version> release
  # with fresh installers + the updater payload (rolling "latest" release).
  # ---------------------------------------------------------------
  release:
    permissions:
      contents: write
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Detect app version
        id: ver
        shell: bash
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: Flatten + rename for the release (flavor-prefixed)
        shell: bash
        run: |
          mkdir -p out
          find artifacts -type f | while read f; do
            base=$(basename "$f")
            case "$f" in
              *external*) name="dsh-app-external-$base" ;;
              *bundled*)  name="dsh-app-bundled-$base" ;;
              *android*)  name="$base" ;;
              *)          name="$base" ;;
            esac
            cp "$f" "out/$name"
          done
          # the launcher updater prefers an asset containing "dsh-app" and
          # ending in .exe — point it at the bundled Windows binary
          if ls out/dsh-app-bundled-dsh-app.exe >/dev/null 2>&1; then
            mv out/dsh-app-bundled-dsh-app.exe out/dsh-app-windows-x86_64.exe
          fi
          ls out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: dsh-app v${{ steps.ver.outputs.v }}
          generate_release_notes: true
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
